# Render "Blueprint": push this repo to GitHub, then on Render choose New -> Blueprint and point it at the repo.
# Render reads this file and creates the three resources below. Secrets (anything marked sync: false) are NOT stored here -
# you paste those into the Render dashboard after the blueprint is created. See SETUP.md for where each value comes from.
databases:
  - name: meso-tracker-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: meso-tracker-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        fromDatabase:
          name: meso-tracker-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: JWT_SIGNING_SECRET
        generateValue: true
      - key: LICENSE_KEY_PEPPER
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: DOWNLOAD_URL
        sync: false
      - key: MAX_ACTIVATIONS
        value: "1"
      - key: LATEST_VERSION
        sync: false
      - key: MIN_SUPPORTED_VERSION
        sync: false
      - key: RELEASE_NOTES
        sync: false

  - type: web
    name: meso-tracker-site
    runtime: static
    rootDir: website
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
