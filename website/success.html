<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're in - Meso Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap status-page">
  <div class="card">
    <h1>You're subscribed!</h1>
    <p>Check your email for your download link and licence key - it should land within a minute or two (check spam just in
       case). Open the app, enter your email and key when it asks, and you're set.</p>
    <p class="note">Didn't get it? <a href="index.html#pricing">Contact us from the pricing page</a> and we'll resend it.</p>
    <a href="index.html" class="btn secondary" style="margin-top:16px;display:inline-block;width:auto;padding:10px 20px">Back to site</a>
  </div>
</div>
<script>
// A little celebratory coin-fall, purely decorative - skipped entirely for reduced-motion.
if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const colors = ["#ffc65c", "#e8801c", "#fff6da", "#7fd4ff"];
  for (let i = 0; i < 46; i++) {
    const p = document.createElement("div");
    p.className = "confetti-piece";
    const size = Math.random() * 7 + 5;
    p.style.left = Math.random() * 100 + "vw";
    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = Math.random() * 2.4 + 2.6 + "s";
    p.style.animationDelay = Math.random() * 1.2 + "s";
    p.style.opacity = String(Math.random() * 0.5 + 0.5);
    document.body.appendChild(p);
  }
}
</script>
</body>
</html>
